name: Aomi reusable CI

on:
  workflow_call:
    inputs:
      runs-on:
        description: JSON array of runner labels for the verify job
        required: false
        type: string
        default: '["self-hosted","aomi-pr-sandbox"]'
      command:
        description: Shell command for verify; leave empty to skip verify and only aggregate
        required: false
        type: string
        default: ""
      gate-runs-on:
        description: JSON array of runner labels for ci-gate (PR code stays off aomi-vps)
        required: false
        type: string
        default: '["self-hosted","aomi-pr-sandbox"]'
      timeout-minutes:
        description: Timeout for the verify job
        required: false
        type: number
        default: 30
      baseline-ref:
        description: Git ref for aomi-vn/.github when installing uv
        required: false
        type: string
        default: main

permissions: {}

jobs:
  verify:
    if: ${{ inputs.command != '' }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: hashFiles('package.json') != ''
        with:
          node-version: "24"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        if: hashFiles('pyproject.toml') != ''
        with:
          repository: aomi-vn/.github
          ref: ${{ inputs.baseline-ref }}
          path: .aomi-baseline
          persist-credentials: false
      - name: Install uv
        if: hashFiles('pyproject.toml') != ''
        env:
          UV_VERSION: "0.13.6"
        run: python3 .aomi-baseline/baseline/install_uv.py
      - name: Run repository verify command
        env:
          VERIFY_COMMAND: ${{ inputs.command }}
        run: bash -lc "$VERIFY_COMMAND"

  ci-gate:
    needs: [verify]
    if: always()
    runs-on: ${{ fromJSON(inputs.gate-runs-on) }}
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Aggregate job results
        env:
          NEEDS: ${{ toJSON(needs) }}
          VERIFY_COMMAND: ${{ inputs.command }}
        run: |
          set -euo pipefail
          printf '%s' "${NEEDS}" | jq -r 'to_entries[] | "\(.key)=\(.value.result)"'
          bad=$(printf '%s' "${NEEDS}" | jq -r '[to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key] | join(" ")')
          if [ -n "${bad}" ]; then
            echo "::error::failed or cancelled: ${bad}. ci-gate fails."
            exit 1
          fi
          if [ -n "${VERIFY_COMMAND}" ]; then
            vr=$(printf '%s' "${NEEDS}" | jq -r '.verify.result // empty')
            if [ "${vr}" != "success" ]; then
              echo "::error::verify did not succeed (result=${vr})."
              exit 1
            fi
          fi
          echo "ci-gate: all required execution succeeded."
