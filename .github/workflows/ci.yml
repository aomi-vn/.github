# Reusable org CI: optional verify command + mandatory ci-gate aggregator.
# Callers: aomi-vn/.github/.github/workflows/ci.yml@main
# Docs: https://docs.github.com/en/actions/sharing-automations/reusing-workflows
name: Aomi reusable CI

on:
  workflow_call:
    inputs:
      runs-on:
        description: JSON array of runner labels for the verify job
        required: false
        type: string
        default: '["self-hosted","aomi-pr-sandbox"]'
      command:
        description: Shell command for verify; leave empty when the caller only wires the gate pattern
        required: false
        type: string
        default: ""
      gate-runs-on:
        description: JSON array of runner labels for ci-gate (host-only, no path filters)
        required: false
        type: string
        default: '["self-hosted","aomi-vps"]'
      timeout-minutes:
        description: Timeout for the verify job
        required: false
        type: number
        default: 30
      needs-json:
        description: Optional serialized needs map from a caller job (gate-only mode)
        required: false
        type: string
        default: ""

jobs:
  verify:
    if: ${{ inputs.command != '' && inputs.needs-json == '' }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        if: hashFiles('package.json') != ''
        with:
          node-version: "24"
          cache: npm
      - uses: astral-sh/setup-uv@v7
        if: hashFiles('pyproject.toml') != ''
        with:
          python-version-file: .python-version
          enable-cache: true
      - name: Run repository verify command
        run: ${{ inputs.command }}

  ci-gate:
    needs: [verify]
    if: always()
    runs-on: ${{ fromJSON(inputs.gate-runs-on) }}
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Aggregate job results
        env:
          NEEDS: ${{ inputs.needs-json != '' && inputs.needs-json || toJSON(needs) }}
        run: |
          set -euo pipefail
          printf '%s' "${NEEDS}" | jq -r 'to_entries[] | "\(.key)=\(.value.result)"'
          bad=$(printf '%s' "${NEEDS}" | jq -r '[to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key] | join(" ")')
          if [ -n "${bad}" ]; then
            echo "::error::failed or cancelled: ${bad}. ci-gate fails."
            exit 1
          fi
          if [ -n "${{ inputs.command }}" ] && [ -z "${{ inputs.needs-json }}" ]; then
            vr=$(printf '%s' "${NEEDS}" | jq -r '.verify.result // empty')
            if [ "${vr}" != "success" ]; then
              echo "::error::verify did not succeed (result=${vr})."
              exit 1
            fi
          fi
          echo "ci-gate: all required execution succeeded."
