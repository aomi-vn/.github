name: Aomi baseline

on:
  workflow_call:
    inputs:
      runs-on:
        required: false
        type: string
        default: '["self-hosted","aomi-pr-sandbox"]'
      verify-command:
        required: true
        type: string
      baseline-ref:
        required: false
        type: string
        default: main
      timeout-minutes:
        required: false
        type: number
        default: 30
    secrets:
      AGENT_REVIEW_API_KEY:
        required: false

permissions: {}

jobs:
  security:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      ZIZMOR_VERSION: "1.31.1"
      ACTIONLINT_VERSION: "1.7.7"
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256_X64: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
      GITLEAKS_SHA256_ARM64: "e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: aomi-vn/.github
          ref: ${{ inputs.baseline-ref }}
          path: .aomi-baseline
          persist-credentials: false
      - name: Workflow permissions
        run: python3 .aomi-baseline/baseline/security/workflow_permissions.py .
      - name: GitHub-hosted runs-on
        run: python3 .aomi-baseline/baseline/security/github_hosted_runs_on.py .
      - name: Action SHA pins
        run: python3 .aomi-baseline/baseline/security/action_pins.py .
      - name: Install uv
        env:
          UV_VERSION: "0.13.6"
        run: python3 .aomi-baseline/baseline/install_uv.py
      - name: Install zizmor
        run: uv tool install "zizmor==${ZIZMOR_VERSION}"
      - name: zizmor
        run: |
          set -euo pipefail
          export PATH="${HOME}/.local/bin:${PATH}"
          zizmor --offline --min-severity medium .github/workflows
      - name: Install actionlint
        run: |
          set -euo pipefail
          arch=$(uname -m)
          case "${arch}" in
            x86_64) tgt=actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz ;;
            aarch64|arm64) tgt=actionlint_${ACTIONLINT_VERSION}_linux_arm64.tar.gz ;;
            *) echo "::error::unsupported arch: ${arch}"; exit 1 ;;
          esac
          curl -sSfL -o "${RUNNER_TEMP}/actionlint.tgz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tgt}"
          tar -xzf "${RUNNER_TEMP}/actionlint.tgz" -C "${RUNNER_TEMP}" actionlint
          "${RUNNER_TEMP}/actionlint" -color -config-file .aomi-baseline/.github/actionlint.yaml
      - name: Install gitleaks
        run: |
          set -euo pipefail
          case "${RUNNER_ARCH}" in
            X64) arch=x64; sum="${GITLEAKS_SHA256_X64}" ;;
            ARM64) arch=arm64; sum="${GITLEAKS_SHA256_ARM64}" ;;
            *) echo "::error::No pinned gitleaks build for ${RUNNER_ARCH}"; exit 1 ;;
          esac
          curl -sSfL -o "${RUNNER_TEMP}/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_${arch}.tar.gz"
          echo "${sum}  ${RUNNER_TEMP}/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/gitleaks.tar.gz" -C "${RUNNER_TEMP}" gitleaks
      - name: gitleaks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_SHA}" ] && [ "${BASE_SHA}" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            range="${BASE_SHA}..${HEAD_SHA}"
          else
            range="-1 ${HEAD_SHA}"
          fi
          "${RUNNER_TEMP}/gitleaks" git --redact --verbose --no-banner --log-opts="--text --no-textconv ${range}" .

  agent-friendly:
    needs: [security]
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: aomi-vn/.github
          ref: ${{ inputs.baseline-ref }}
          path: .aomi-baseline
          persist-credentials: false
      - run: python3 .aomi-baseline/baseline/agent_friendly.py .

  verify:
    needs: [security]
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: hashFiles('package.json') != ''
        with:
          node-version: "24"
      - run: npm ci
        if: hashFiles('package-lock.json') != ''
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        if: hashFiles('pyproject.toml') != ''
        with:
          repository: aomi-vn/.github
          ref: ${{ inputs.baseline-ref }}
          path: .aomi-baseline
          persist-credentials: false
      - name: Install uv
        if: hashFiles('pyproject.toml') != ''
        env:
          UV_VERSION: "0.13.6"
        run: python3 .aomi-baseline/baseline/install_uv.py
      - env:
          VERIFY_COMMAND: ${{ inputs.verify-command }}
        run: bash -lc "$VERIFY_COMMAND"

  no-comments:
    needs: [security]
    if: github.event_name == 'pull_request'
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: aomi-vn/.github
          ref: ${{ inputs.baseline-ref }}
          path: .aomi-baseline
          persist-credentials: false
      - env:
          NO_COMMENTS_BASE: origin/${{ github.base_ref }}
        run: python3 .aomi-baseline/baseline/no_comments.py "$NO_COMMENTS_BASE"

  typecheck:
    needs: [security]
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: aomi-vn/.github
          ref: ${{ inputs.baseline-ref }}
          path: .aomi-baseline
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: hashFiles('package.json') != ''
        with:
          node-version: "24"
      - run: npm ci
        if: hashFiles('package-lock.json') != ''
      - name: Install uv
        if: hashFiles('pyproject.toml') != ''
        env:
          UV_VERSION: "0.13.6"
        run: python3 .aomi-baseline/baseline/install_uv.py
      - run: bash .aomi-baseline/baseline/typecheck.sh

  agent-review:
    needs: [security]
    if: github.event_name == 'pull_request'
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write
    concurrency:
      group: agent-review-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: aomi-vn/.github
          ref: ${{ inputs.baseline-ref }}
          path: .aomi-baseline
          persist-credentials: false
      - env:
          GITHUB_TOKEN: ${{ github.token }}
          AGENT_REVIEW_API_KEY: ${{ secrets.AGENT_REVIEW_API_KEY }}
        run: python3 .aomi-baseline/baseline/agent_review.py

  ci-gate:
    needs: [security, agent-friendly, verify, no-comments, typecheck, agent-review]
    if: always()
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 2
    permissions: {}
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
          IS_PR: ${{ github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail
          printf '%s' "$NEEDS" | jq -r 'to_entries[] | "\(.key)=\(.value.result)"'
          if [ "$IS_PR" = "true" ]; then
            required='["security","agent-friendly","verify","no-comments","typecheck","agent-review"]'
          else
            required='["security","agent-friendly","verify","typecheck"]'
          fi
          bad=$(printf '%s' "$NEEDS" | jq -r --argjson r "$required" '[to_entries[] | select((.key as $k | $r | index($k)) and .value.result != "success") | .key] | join(" ")')
          if [ -n "$bad" ]; then
            echo "::error::ci-gate: not successful: $bad"
            exit 1
          fi
          echo "ci-gate: baseline passed."
