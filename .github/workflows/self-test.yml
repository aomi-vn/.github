name: Baseline self-test

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

env:
  ZIZMOR_VERSION: "1.31.1"
  ACTIONLINT_VERSION: "1.7.7"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256_X64: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  GITLEAKS_SHA256_ARM64: "e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080"

jobs:
  security:
    runs-on: [self-hosted, aomi-pr-sandbox]
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Workflow permissions
        run: python3 baseline/security/workflow_permissions.py .
      - name: GitHub-hosted runs-on
        run: python3 baseline/security/github_hosted_runs_on.py .
      - name: Action SHA pins
        run: python3 baseline/security/action_pins.py .
      - name: Install uv
        env:
          UV_VERSION: "0.13.6"
        run: python3 baseline/install_uv.py
      - name: Install zizmor
        run: uv tool install "zizmor==${ZIZMOR_VERSION}"
      - name: zizmor
        run: |
          set -euo pipefail
          export PATH="${HOME}/.local/bin:${PATH}"
          zizmor --offline --min-severity medium .github/workflows
      - name: Install actionlint
        run: |
          set -euo pipefail
          arch=$(uname -m)
          case "${arch}" in
            x86_64) tgt=actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz ;;
            aarch64|arm64) tgt=actionlint_${ACTIONLINT_VERSION}_linux_arm64.tar.gz ;;
            *) echo "::error::unsupported arch: ${arch}"; exit 1 ;;
          esac
          curl -sSfL -o "${RUNNER_TEMP}/actionlint.tgz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tgt}"
          tar -xzf "${RUNNER_TEMP}/actionlint.tgz" -C "${RUNNER_TEMP}" actionlint
          "${RUNNER_TEMP}/actionlint" -color -config-file .github/actionlint.yaml
      - name: Install gitleaks
        run: |
          set -euo pipefail
          case "${RUNNER_ARCH}" in
            X64) arch=x64; sum="${GITLEAKS_SHA256_X64}" ;;
            ARM64) arch=arm64; sum="${GITLEAKS_SHA256_ARM64}" ;;
            *) echo "::error::No pinned gitleaks build for ${RUNNER_ARCH}"; exit 1 ;;
          esac
          curl -sSfL -o "${RUNNER_TEMP}/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_${arch}.tar.gz"
          echo "${sum}  ${RUNNER_TEMP}/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/gitleaks.tar.gz" -C "${RUNNER_TEMP}" gitleaks
      - name: gitleaks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_SHA}" ] && [ "${BASE_SHA}" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            range="${BASE_SHA}..${HEAD_SHA}"
          else
            range="-1 ${HEAD_SHA}"
          fi
          "${RUNNER_TEMP}/gitleaks" git --redact --verbose --no-banner --log-opts="--text --no-textconv ${range}" .

  test:
    needs: [security]
    runs-on: [self-hosted, aomi-pr-sandbox]
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv
        env:
          UV_VERSION: "0.13.6"
        run: python3 baseline/install_uv.py
      - run: python3 -m unittest discover -s baseline/tests -v
      - env:
          NO_COMMENTS_BASE: origin/${{ github.base_ref }}
        run: python3 baseline/no_comments.py "$NO_COMMENTS_BASE"
        if: github.event_name == 'pull_request'
      - run: uvx mypy --strict baseline/security baseline/agent_friendly.py baseline/no_comments.py baseline/agent_review.py

  ci-gate:
    needs: [security, test]
    if: ${{ !cancelled() }}
    runs-on: [self-hosted, aomi-pr-sandbox]
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Check job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          printf '%s' "${NEEDS}" | jq -r 'to_entries[] | "\(.key)=\(.value.result)"'
          bad=$(printf '%s' "${NEEDS}" | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key] | join(" ")')
          if [ -n "${bad}" ]; then
            echo "::error::failed or cancelled: ${bad}. ci-gate fails."
            exit 1
          fi
          echo "ci-gate: every needed job succeeded or was skipped."
